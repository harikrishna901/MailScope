<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 180px;
      height: 180px;
      overflow: hidden;
      background: #060A16;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .inner {
      width: 140px;
      height: 140px;
      border-radius: 36px;
      background: linear-gradient(135deg, #0C1426, #111B33);
      border: 2px solid rgba(34, 211, 238, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(34, 211, 238, 0.25);
    }
  </style>
</head>
<body>
  <div class="inner">
    <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="22" y1="12" x2="18" y2="12"/>
      <line x1="6" y1="12" x2="2" y2="12"/>
      <line x1="12" y1="6" x2="12" y2="2"/>
      <line x1="12" y1="22" x2="12" y2="18"/>
      <circle cx="12" cy="12" r="4.5" stroke="#6366F1"/>
    </svg>
  </div>
</body>
</html>
